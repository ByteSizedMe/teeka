<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teeka phone</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #10151c; color: #fff; font: 18px/1.4 system-ui, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  h1 { font-size: 2rem; margin: .2em 0; }
  .sub { color: #aeb7c6; margin: 0 0 1.2rem; }
  .avatar { width: 110px; height: 110px; border-radius: 50%; background: #2c3645; display: grid; place-items: center; font-size: 3rem; margin-bottom: 12px; }
  .btns { display: flex; gap: 48px; margin-top: 28px; }
  .round { width: 84px; height: 84px; border-radius: 50%; border: 0; font-size: 2rem; color: #fff; cursor: pointer; }
  .green { background: #1fa971; } .red { background: #d3382c; }
  .big { padding: 16px 28px; font-size: 1.2rem; border-radius: 14px; border: 0; background: #1fa971; color: #fff; cursor: pointer; }
  .screen { display: none; width: 100%; max-width: 420px; flex-direction: column; align-items: center; }
  .screen.on { display: flex; }
  .ring .avatar { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  #subtitle { margin: 12px 0; min-height: 3rem; color: #d8dee9; font-size: 1rem; }
  #mock { display: none; width: 100%; margin-top: 12px; gap: 8px; flex-direction: column; }
  #mock.on { display: flex; }
  #mock input { padding: 12px; border-radius: 10px; border: 1px solid #3a4558; background: #1a212c; color: #fff; font-size: 1rem; width: 100%; }
  #mock .r { display: flex; gap: 8px; }
  #mock button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #3a4558; background: #243042; color: #fff; font-size: 1rem; }
  .tag { font-size: .8rem; background: #b4540a; border-radius: 999px; padding: 2px 10px; }
  #err { color: #ffb4a8; margin-top: 12px; min-height: 1.4rem; font-size: .95rem; }
</style>
</head>
<body>
  <div id="setup" class="screen on">
    <div class="avatar">☎</div>
    <h1>Teeka</h1>
    <p class="sub">Practice calls. Tap once so this phone can ring and listen.</p>
    <button id="setupBtn" class="big">Set up this phone</button>
  </div>

  <div id="waiting" class="screen">
    <div class="avatar">☎</div>
    <h1>Ready</h1>
    <p class="sub">Waiting for a practice call. Keep this page open.</p>
    <span id="mockTag" class="tag" hidden>Mock mode</span>
  </div>

  <div id="ringing" class="screen ring">
    <div class="avatar">☎</div>
    <p class="sub">Incoming call</p>
    <h1 id="callerId"></h1>
    <div class="btns">
      <button id="declineBtn" class="round red" aria-label="Decline">✕</button>
      <button id="answerBtn" class="round green" aria-label="Answer">✆</button>
    </div>
  </div>

  <div id="incall" class="screen">
    <div class="avatar">☎</div>
    <h1 id="callerId2"></h1>
    <p class="sub" id="timer">00:00</p>
    <div id="subtitle"></div>
    <div id="mock">
      <input id="replyText" placeholder="Type what the person says" autocomplete="off">
      <div class="r"><button id="sendBtn">Send reply</button><button id="silentBtn">Say nothing</button></div>
    </div>
    <div class="btns"><button id="endBtn" class="round red" aria-label="End call">✕</button></div>
  </div>

  <div id="ended" class="screen">
    <div class="avatar">☎</div>
    <h1>Call ended</h1>
    <p class="sub" id="endMsg">That was a practice call. Nothing was real.</p>
  </div>
  <div id="err" role="alert"></div>

<script>
const $ = (id) => document.getElementById(id);
let ws, cfg = { mock: true }, audioCtx, ringTimer, ringGain, ringOsc = [], micStream, micNode, timerIv, callStart;
let player = new Audio(), playQueue = [], playing = false, endAfterPlay = false;

function show(id) { document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('on', s.id === id)); }
function err(t) { $('err').textContent = t || ''; }
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

// ---- ringtone: two tones, 1 s on / 2 s off, like a desk phone ----
function startRing() {
  stopRing();
  if (!audioCtx) return;
  ringGain = audioCtx.createGain(); ringGain.gain.value = 0; ringGain.connect(audioCtx.destination);
  ringOsc = [440, 480].map((f) => { const o = audioCtx.createOscillator(); o.frequency.value = f; o.connect(ringGain); o.start(); return o; });
  const burst = () => {
    const t = audioCtx.currentTime;
    ringGain.gain.setTargetAtTime(0.25, t, 0.01);
    ringGain.gain.setTargetAtTime(0, t + 1.0, 0.01);
    if (navigator.vibrate) navigator.vibrate([600, 200, 600]);
  };
  burst(); ringTimer = setInterval(burst, 3000);
}
function stopRing() {
  clearInterval(ringTimer);
  ringOsc.forEach((o) => { try { o.stop(); } catch (e) {} }); ringOsc = [];
  if (navigator.vibrate) navigator.vibrate(0);
}

// ---- caller / teacher audio (server sends audio_url once Timbre is on) ----
function playNext() {
  if (playing) return;
  const item = playQueue.shift();
  if (!item) { if (endAfterPlay) { endAfterPlay = false; finishCall(); } return; }
  playing = true;
  player.src = item;
  send({ type: 'playback_start' });
  const done = () => { playing = false; send({ type: 'playback_end' }); playNext(); };
  player.onended = done; player.onerror = done;
  player.play().catch(done);
}

// ---- microphone: 48 kHz capture, worklet resamples to 16 kHz, 1,024-byte frames ----
async function startMic() {
  if (cfg.mock) return;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 48000,
      echoCancellation: false, noiseSuppression: true, autoGainControl: true } });
    const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
    await ctx.audioWorklet.addModule('/static/mic-worklet.js');
    micNode = new AudioWorkletNode(ctx, 'downsampler');
    micNode.port.onmessage = (e) => { if (ws && ws.readyState === 1) ws.send(e.data); };
    const src = ctx.createMediaStreamSource(micStream);
    src.connect(micNode); // not connected to the speakers
    micNode.ctx = ctx;
  } catch (e) {
    err('The microphone is blocked. Open this page over HTTPS (the tunnel link), not the laptop IP.');
  }
}
function stopMic() {
  if (micStream) micStream.getTracks().forEach((t) => t.stop());
  if (micNode) { micNode.port.onmessage = null; try { micNode.ctx.close(); } catch (e) {} }
  micStream = micNode = null;
}

function finishCall() {
  stopMic(); stopRing(); clearInterval(timerIv);
  show('ended');
  setTimeout(() => show('waiting'), 6000);
}

function tick() {
  const s = Math.floor((Date.now() - callStart) / 1000);
  $('timer').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function onMsg(m) {
  if (m.type === 'config') {
    cfg = m; $('mockTag').hidden = !m.mock; $('mock').classList.toggle('on', !!m.mock);
  } else if (m.type === 'ring') {
    $('callerId').textContent = $('callerId2').textContent = m.caller_id;
    show('ringing'); startRing(); err('');
  } else if (m.type === 'caller' || m.type === 'teacher') {
    if (m.audio_url) playQueue.push(m.audio_url);
    // Words are shown only when there is no voice (mock mode, or Timbre failed).
    if (cfg.mock || !m.audio_url) $('subtitle').textContent = m.text;
    if (m.audio_url) playNext();
  } else if (m.type === 'end') {
    if (!document.querySelector('#ringing.on, #incall.on')) return; // already hung up here
    stopRing(); stopMic();
    $('endMsg').textContent = m.ending === 'unanswered' || m.ending === 'cancelled'
      ? 'The practice call was cancelled.' : 'That was a practice call. Nothing was real.';
    if (playing || playQueue.length) endAfterPlay = true; else finishCall();
  }
}

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/call');
  ws.binaryType = 'arraybuffer';
  ws.onmessage = (e) => { try { onMsg(JSON.parse(e.data)); } catch (x) {} };
  ws.onclose = () => { err('Reconnecting…'); setTimeout(connect, 1500); };
  ws.onopen = () => err('');
}

$('setupBtn').onclick = async () => {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();
  try { await navigator.wakeLock.request('screen'); } catch (e) {}
  try { player.play().catch(() => {}); player.pause(); } catch (e) {} // unlock playback
  show('waiting'); connect();
};
$('answerBtn').onclick = async () => {
  stopRing(); send({ type: 'answer' }); show('incall');
  callStart = Date.now(); clearInterval(timerIv); timerIv = setInterval(tick, 500); tick();
  $('subtitle').textContent = '';
  await startMic();
};
$('declineBtn').onclick = () => { stopRing(); send({ type: 'decline' }); };
$('endBtn').onclick = () => { send({ type: 'hangup' }); playQueue = []; player.pause(); finishCall(); };
$('sendBtn').onclick = () => { const t = $('replyText').value; $('replyText').value = ''; send({ type: 'reply', text: t }); };
$('silentBtn').onclick = () => send({ type: 'silence' });
$('replyText').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('sendBtn').click(); });
</script>
</body>
</html>
